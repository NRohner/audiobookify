[project]
name = "audiobookify"
version = "0.1.0"
description = "Local audiobook generator"
requires-python = ">=3.12"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "num2words>=0.5.13",
    "soundfile>=0.12",
    "numpy>=1.26",
    "mutagen>=1.47",
    "mlx-audio==0.5.9",  # TTS runtime (Apple Silicon); see engines/turbo.py
    "librosa>=0.10",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    # AutoTokenizer for the Turbo engine (mlx-audio chatterbox_turbo)
    "transformers>=5.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
audiobookify = "audiobookify.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["integration: requires real model weights/hardware, run explicitly"]
addopts = "-m 'not integration'"

[project]
name = "audiobookify"
version = "0.1.0"
description = "Local audiobook generator"
requires-python = ">=3.12"
dependencies = [
    "soundfile>=0.12",
    "numpy>=1.26",
    "mlx-audio==0.5.9",  # TTS runtime (Apple Silicon); see engines/turbo.py
    # model_store imports these directly and relies on hf 2.2's Xet store layout
    "huggingface_hub>=2.2",
    "tqdm>=4.66",
    # AutoTokenizer for the Turbo engine (mlx-audio chatterbox_turbo)
    "transformers>=5.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["integration: requires real model weights/hardware, run explicitly"]
addopts = "-m 'not integration'"

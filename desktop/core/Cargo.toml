[package]
name = "audiobookify-core"
version = "0.1.0"
edition = "2021"

[dependencies]
fancy-regex = "0.19"
html5ever = "0.39"
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

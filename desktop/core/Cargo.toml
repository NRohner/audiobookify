[package]
name = "audiobookify-core"
version = "0.1.0"
edition = "2021"

[dependencies]
fancy-regex = "0.19"
hound = "3.5"
html5ever = "0.39"
id3 = "1.17"
libc = "0.2"
num-bigint = "0.5"
num-integer = "0.1"
num-traits = "0.2"
regex = "1"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphonia = { version = "0.5", features = ["all"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

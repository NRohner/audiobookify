[package]
name = "audiobookify-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
audiobookify-core = { path = "core" }
libc = "0.2"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"

[workspace]
members = ["core"]
